<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - YuFind!</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">
        <img src="../img/logo.png" alt="YuFind!" />
        <a href="../index.html">YuFind!</a>
      </div>

      <div class="navbar-nav">
        <div class="nav-left">
          <a href="../index.html">Home</a>
          <a href="../my-reports.html">Laporanku</a>
        </div>

        <div class="nav-right">
          <img src="../img/loginpfp.png" alt="pfp" />
          <a href="login.html">Login</a>
        </div>
      </div>
    </nav>

    <!-- REGISTER -->
    <section class="auth">
      <div class="auth-container register">
        <h2>Buat Akun</h2>

        <form id="registerForm">
          <div class="input-group">
            <label for="nama">Nama</label>
            <input
              type="text"
              id="nama"
              name="nama"
              placeholder="Masukkan nama"
              required
            />
          </div>

          <div class="input-group">
            <label for="nim">NIM</label>
            <input
              type="text"
              id="nim"
              name="nim"
              placeholder="Masukkan NIM"
              required
            />
          </div>

          <div class="input-group">
            <label for="jurusan">Jurusan</label>
            <input
              type="text"
              id="jurusan"
              name="jurusan"
              placeholder="Masukkan Jurusan"
              required
            />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              required
            />
          </div>

          <button type="submit" class="btn-auth">Daftar</button>
        </form>

        <p class="auth-switch">
          Sudah punya akun?
          <a href="login.html">Masuk</a>
        </p>
      </div>
    </section>
  </body>
  <script src="../js/script.js"></script>
</html>
